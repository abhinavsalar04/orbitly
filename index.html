<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Orbitly – Bring your tasks and notes into orbit</title>
    <link rel="icon" href="orbitly-mark.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --bg: #eceeec;
        --surface: #f8f9f8;
        --raised: #ffffff;
        --foot: #f0f2f0;
        --line: #d9ddda;
        --ink: #242a2b;
        --muted: #768083;
        --green: #2cac74;
        --s-todo: #6f7c84;
        --s-progress: #3a7fd0;
        --s-pending: #a97c0a;
        --s-done: #1f8f35;
        --f-backend: #4f9cf0;
        --f-frontend: #f2c14e;
        --f-both: #8b7cf6;
        --f-swag: #f08a5d;
        --f-cert: #b48cf2;
        --f-h2s: #3fc7b0;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #101012;
          --surface: #17171a;
          --raised: #202024;
          --foot: #1b1b1f;
          --line: #2a2a2f;
          --ink: #e8e8ea;
          --muted: #8e8e96;
          --s-todo: #9aa6ad;
          --s-progress: #6fb0f5;
          --s-pending: #e6b84a;
          --s-done: #4cc265;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #101012;
        --surface: #17171a;
        --raised: #202024;
        --foot: #1b1b1f;
        --line: #2a2a2f;
        --ink: #e8e8ea;
        --muted: #8e8e96;
        --s-todo: #9aa6ad;
        --s-progress: #6fb0f5;
        --s-pending: #e6b84a;
        --s-done: #4cc265;
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 "Manrope", system-ui, -apple-system, "Segoe UI",
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 900px;
        min-width: 0;
        margin: 0 auto;
        padding: 22px 18px 64px;
      }
      svg {
        flex: none;
      }
      .nav {
        position: sticky;
        top: 0;
        z-index: 40;
        padding-top: env(safe-area-inset-top, 0px);
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(10px);
      }
      .navin {
        max-width: 900px;
        margin: 0 auto;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .mark {
        width: 46px;
        height: 46px;
        display: block;
        flex: none;
      }
      .brandtext {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
        margin: 0;
      }
      h1 .ly {
        color: var(--green);
      }
      .tag {
        color: var(--green);
        font-size: 11px;
        font-weight: 600;
        line-height: 1.2;
        margin-top: 2px;
      }
      .tabs {
        display: inline-flex;
        gap: 4px;
        padding: 4px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .tab {
        border: 0;
        border-radius: 9px;
        padding: 7px 18px;
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
      }
      .tab[aria-selected="true"] {
        background: var(--raised);
        color: var(--green);
      }
      .headside {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }
      .navlogin {
        height: 36px;
        padding: 0 14px;
        background: var(--green);
        border-color: var(--green);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
      }
      .navlogin:hover {
        filter: brightness(1.1);
        border-color: var(--green);
      }
      .profile {
        position: relative;
      }
      .avatar {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--green);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .avatar:hover {
        filter: brightness(1.1);
        border-color: transparent;
      }
      .pmenu {
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        min-width: 210px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
        z-index: 50;
      }
      .pname {
        font-weight: 700;
        font-size: 14px;
        padding: 6px 8px 0;
      }
      .pemail {
        color: var(--muted);
        font-size: 12.5px;
        padding: 2px 8px 8px;
        overflow-wrap: anywhere;
      }
      .pmenu .out {
        width: 100%;
        height: 34px;
        font-size: 13px;
        font-weight: 600;
      }
      .auth {
        max-width: 420px;
        margin: 8px auto 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px 22px 18px;
      }
      .auth:focus-within {
        border-color: var(--green);
      }
      .auth h2 {
        margin: 0 0 6px;
        padding: 0;
        font-size: 22px;
        font-weight: 700;
      }
      .authlead {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 13.5px;
      }
      .fld {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .fld input {
        height: 42px;
        padding: 0 12px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 9px;
        font-weight: 500;
      }
      .fld input:focus {
        outline: none;
        border-color: var(--green);
      }
      button.authgo {
        display: flex;
        width: 100%;
        height: 42px;
        justify-content: center;
        margin-top: 4px;
      }
      .authlinks {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
      }
      .authlinks button {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 4px 0;
        font-size: 13px;
        font-weight: 600;
      }
      .authlinks button:hover {
        color: var(--ink);
        border-color: transparent;
      }
      .or {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 16px 0 12px;
        color: var(--muted);
        font-size: 12px;
      }
      .or::before,
      .or::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .google {
        display: flex;
        width: 100%;
        height: 42px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: var(--raised);
        font-weight: 600;
      }
      .google svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .autherr {
        margin: 0 0 10px;
        padding: 0;
        color: #d4533e;
        font-size: 13px;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="date"],
      textarea,
      select {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        min-width: 0;
      }
      textarea {
        width: 100%;
        resize: vertical;
        line-height: 1.5;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 8px 12px;
      }
      button:hover {
        border-color: var(--muted);
      }
      :focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }
      .muted {
        color: var(--muted);
      }
      .vr {
        width: 1px;
        height: 20px;
        background: var(--line);
        flex: none;
      }
      .ico {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .composer {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .composer:focus-within {
        border-color: var(--green);
      }
      .composer .in {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 16px 18px;
        outline: none;
        resize: none;
      }
      .composer textarea.in {
        min-height: 120px;
      }
      .composer input.in {
        font-weight: 600;
        padding-bottom: 0;
      }
      .cfoot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        background: var(--foot);
      }
      .cfoot .sp {
        flex: 1;
      }
      .dd {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 0 11px;
        height: 34px;
        font-size: 13px;
        font-weight: 600;
      }
      .dd .ico {
        color: var(--muted);
      }
      .dd .chv {
        opacity: 0.6;
        width: 14px;
        height: 14px;
      }
      .dfield {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
      }
      .dfield .ico {
        color: var(--muted);
        pointer-events: none;
      }
      .dfield input,
      .rng input {
        border: 0;
        background: transparent;
        padding: 0;
        font-size: 13px;
        border-radius: 0;
        position: relative;
        width: 7.5em;
        min-width: 0;
        max-width: 100%;
        outline: none;
      }
      input[type="date"]::-webkit-calendar-picker-indicator {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
      button.add {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--green);
        border-color: var(--green);
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        height: 36px;
        padding: 0 16px;
      }
      button.add:hover {
        filter: brightness(1.1);
        border-color: var(--green);
      }
      .ib {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid transparent;
        color: var(--muted);
      }
      .ib svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ib:hover {
        color: var(--green);
        border-color: var(--line);
        background: var(--surface);
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .stat {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 6px 5px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .stat .ico {
        color: var(--muted);
      }
      .stat .n {
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--raised);
        border: 1px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .stat[aria-pressed="true"] {
        border-color: var(--green);
        color: var(--green);
      }
      .stat[aria-pressed="true"] .ico {
        color: var(--green);
      }
      .fbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      .fbar input[type="text"] {
        flex: 1 1 180px;
        min-width: 0;
        max-width: 100%;
        height: 36px;
        border-radius: 9px;
        background: var(--surface);
      }
      .rng {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        max-width: 100%;
        min-width: 0;
        padding: 0 12px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 9px;
        font-size: 13px;
        box-sizing: border-box;
      }
      .rng .ico {
        color: var(--muted);
        pointer-events: none;
      }
      .fbar .dd {
        height: 36px;
        background: var(--surface);
      }
      .menu {
        position: fixed;
        z-index: 50;
        min-width: 170px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 4px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
      }
      .menu button {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 7px;
        padding: 7px 10px;
        text-align: left;
        font-size: 13px;
      }
      .menu button:hover,
      .menu button[aria-selected="true"] {
        background: color-mix(in srgb, var(--ink) 8%, transparent);
      }
      .menu .ico {
        color: var(--muted);
      }

      .pill,
      .fpill {
        display: inline-flex;
        align-items: center;
        box-sizing: border-box;
        height: 28px;
        gap: 6px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
      }
      .pill {
        --c: var(--s-todo);
        color: var(--c);
        background: transparent;
        border: 1px solid var(--line);
        padding: 0 10px;
      }
      .st-todo {
        --c: var(--s-todo);
      }
      .st-progress {
        --c: var(--s-progress);
      }
      .st-pending {
        --c: var(--s-pending);
      }
      .st-done {
        --c: var(--s-done);
      }
      select.pill {
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
        height: 28px;
        line-height: 26px;
      }
      select.pill option {
        color: var(--ink);
        background: var(--raised);
      }
      .fpill {
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 0 10px;
        font-weight: 500;
      }
      .fpill select {
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 500;
        height: 26px;
        line-height: 26px;
        padding: 0;
        margin: 0;
        cursor: pointer;
        max-width: 148px;
      }
      .fpill select option {
        color: var(--ink);
        background: var(--raised);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c, var(--muted));
        flex: none;
      }

      .panel {
        background: transparent;
        border: 0;
        overflow: visible;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .group + .group {
        margin-top: 14px;
      }
      .group h3 {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 0;
        padding: 4px 4px 0;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .panel,
      .group,
      .row {
        min-width: 0;
        max-width: 100%;
      }
      .row {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .rh {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 16px;
        cursor: pointer;
      }
      .row.open .rh {
        padding-bottom: 8px;
      }
      .row:not(.open) .rh:hover {
        border-radius: 12px;
      }
      .row.open .rh:hover {
        border-radius: 12px 12px 0 0;
      }
      .rh:hover {
        background: color-mix(in srgb, var(--ink) 4%, transparent);
      }
      .meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .meta + .chev {
        margin-left: 0;
      }
      .lead,
      .snip {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nt {
        flex: 0 1 auto;
        max-width: 45%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
      }
      .nt + .snip {
        color: var(--muted);
      }
      .when {
        flex: none;
        margin-left: auto;
        color: var(--muted);
        font-size: 12.5px;
      }
      .snip + .when {
        margin-left: 0;
      }
      .chev {
        flex: none;
        margin-left: auto;
        color: var(--muted);
        display: inline-flex;
        transition: transform 0.15s;
      }
      .when + .chev {
        margin-left: 0;
      }
      .row.open .chev {
        transform: rotate(180deg);
      }
      .row.open .snip {
        display: none;
      }
      .row.open .nt {
        flex: 1;
        max-width: none;
      }
      .rb {
        display: none;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
        padding: 2px 16px 16px;
      }
      .row.open .rb {
        display: flex;
      }
      .rb textarea {
        flex: 1;
      }
      .txt {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .txt p {
        margin: 0 0 4px;
      }
      .txt p.blank {
        margin: 0;
        min-height: 1em;
      }
      .txt ul,
      .txt ol {
        margin: 0 0 4px;
        padding-left: 22px;
      }
      .txt ul {
        list-style: disc;
      }
      .txt ol {
        list-style: decimal;
      }
      .txt li {
        margin: 2px 0;
      }
      .actions {
        display: flex;
        gap: 2px;
        flex: none;
      }
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 52px 16px;
        border: 1px dashed var(--line);
        border-radius: 14px;
        color: var(--muted);
        text-align: center;
      }
      .empty .circ {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--surface);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .empty .ico {
        width: 22px;
        height: 22px;
      }
      .gate {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 72px 16px;
        color: var(--muted);
        text-align: center;
      }
      .gate p {
        margin: 0;
        font-size: 14px;
      }
      .gate-list {
        padding: 48px 16px;
        border: 1px dashed var(--line);
        border-radius: 14px;
      }
      .spin {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid var(--line);
        border-top-color: var(--green);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spin {
          animation: none;
        }
      }
      footer {
        margin-top: 24px;
        color: var(--muted);
        font-size: 13px;
      }
      .shell {
        min-height: 100vh;
        display: flex;
      }
      .side {
        width: 248px;
        flex: none;
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 16px 12px 12px;
        z-index: 30;
      }
      body:not(.signed-in) .side {
        display: none;
      }
      .sidebrand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px 8px;
        min-width: 0;
      }
      .sidebrand .brandtext {
        min-width: 0;
      }
      .side .tag {
        white-space: normal;
      }

      .sidefoot .pmenu {

        left: 0;
        right: 0;
      }
      .maincol {

        width: 100%;
        min-width: 0;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        overflow-x: clip;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 18px;
        padding-top: calc(10px + env(safe-area-inset-top, 0px));

        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(10px);

        align-items: center;
        gap: 10px;
        min-width: 0;

        width: 32px;
        height: 32px;
      }

        font-size: 18px;
        font-weight: 700;

        line-height: 1.05;
      }
      .wordmark .ly {
        color: var(--green);
      }
      .topend {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .menuBtn {
        display: none;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        background: transparent;
        align-items: center;
        justify-content: center;
      }
      .backdrop {

        inset: 0;
        z-index: 55;
        background: color-mix(in srgb, #000 42%, transparent);
        backdrop-filter: blur(6px);
      }
      @media (max-width: 800px) {
        body.signed-in .topbar {
          display: grid;
          grid-template-columns: 40px 1fr 40px;
          align-items: center;
          padding: 8px 12px;
          padding-top: calc(8px + env(safe-area-inset-top, 0px));

        }
        body.signed-in .menuBtn {

        }
        body.signed-in .side {

          z-index: 60;
          left: 0;
          top: 0;
          width: min(280px, 86vw);
          transform: translateX(-105%);
          transition: transform 0.2s ease;
        }
        body.signed-in.drawer-open .side {
          transform: translateX(0);
        }
        body.drawer-open {
          overflow: hidden;
        }
        .cfoot .add {
          flex: 1 1 100%;
          justify-content: center;
        }
        .fbar > *,
        .cfoot > *,
        .stats,
        .composer,
        .panel,
        .row,
        .rng {
          max-width: 100%;
          min-width: 0;
        }
        .rng {
          flex: 1 1 100%;
          width: 100%;
        }
        .fbar input[type="text"] {

        }
        .dd {

        }

      @media (prefers-reduced-motion: reduce) {
        body.signed-in .side {

      @media (max-width: 560px) {
        .ib {
          width: 36px;
          height: 36px;

          height: 36px;

        }
      }
      .accountbtn .avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;

      }

    <script>
      (function () {
        var FLAGS = [
          { id: "backend", label: "Backend", dot: "var(--f-backend)" },
          { id: "frontend", label: "Frontend", dot: "var(--f-frontend)" },

          clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
          chk: '<circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
          tag: '<path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',
          cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
          sort: '<path d="M8 5v14M5 16l3 3 3-3M16 19V5M13 8l3-3 3 3"/>',
          inbox: '<path d="M4 13l2-8h12l2 8M4 13v6h16v-6M4 13h5l1 2h4l1-2h5"/>',

          del: '<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
          done: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
          close: '<path d="M6 6l12 12M18 6L6 18"/>',
          chev: '<path d="M6 9l6 6 6-6"/>',
          search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
        };
        var STAT = [
          { id: "todo", label: "To do", ic: IC.list },
          { id: "progress", label: "In progress", ic: IC.dash },
          { id: "pending", label: "Pending", ic: IC.clock },
          { id: "done", label: "Completed", ic: IC.chk },
        ];
        var $ = function (i) {
          return document.getElementById(i);
        };
        var tasks = [],
          notes = [],
          ready = false,
          user = null,
          fs = null,
          stops = [],
          seen = { tasks: false, notes: false },

          restCount = { tasks: 0, notes: 0 },
          liveSeen = { tasks: false, notes: false },
          pending = { tasks: {}, notes: {} },
          dropped = { tasks: {}, notes: {} },
          loadProblem = "",
          session = 0,
          authSettled = false,
          uploadStarted = false;
        var T = {
          status: "all",
          flag: "all",
          q: "",
          preset: "30",
          from: "",
          to: "",
          sort: "desc",
          open: {},
        };
        var N = {
          q: "",
          preset: "30",
          from: "",
          to: "",
          sort: "desc",
          open: {},
        };
        var composerStatus = "todo",
          composerFlag = "backend";

        function el(tag, className, text) {
          var element = document.createElement(tag);
          if (className) element.className = className;
          if (text != null) element.textContent = text;
          return element;
        }
        function svg(path, className) {
          var icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          icon.setAttribute("viewBox", "0 0 24 24");
          icon.setAttribute("aria-hidden", "true");
          icon.setAttribute("class", "ico" + (className ? " " + className : ""));
          icon.innerHTML = path;
          return icon;
        }
        function ymd(date) {
          var month = date.getMonth() + 1,
            day = date.getDate();
          return (
            date.getFullYear() +
            "-" +
            (month < 10 ? "0" : "") +
            month +
            "-" +
            (day < 10 ? "0" : "") +
            day
          );
        }
        function today() {
          return ymd(new Date());
        }
        function shift(dateText, dayCount) {
          var parts = dateText.split("-");
          return ymd(new Date(+parts[0], +parts[1] - 1, +parts[2] + dayCount));
        }
        function parse(dateText) {
          var parts = dateText.split("-");
          return new Date(+parts[0], +parts[1] - 1, +parts[2]);
        }
        function shortDate(dateText) {
          return parse(dateText).toLocaleDateString(undefined, {
            day: "numeric",
            month: "short",
            year: "numeric",
          });
        }
        function dlabel(dateText) {
          var formatted = parse(dateText).toLocaleDateString(undefined, {
            weekday: "long",
            day: "numeric",
            month: "short",
            year: "numeric",
          });
          return dateText === today()
            ? "Today, " + formatted
            : dateText === shift(today(), -1)
            ? "Yesterday, " + formatted
            : formatted;
        }
        function uid() {
          return (
            Date.now().toString(36) + Math.random().toString(36).slice(2, 6)
          );
        }
        function drop(list, id) {
          for (var i = 0; i < list.length; i++)
            if (list[i].id === id) {
              list.splice(i, 1);
              break;
            }
        }
        var flagById = function (id) {
          return (
            FLAGS.filter(function (flag) {
              return flag.id === id;
            })[0] || FLAGS[0]
          );
        };
        function dot(color) {
          var mark = el("span", "dot");
          mark.style.setProperty("--c", color);
          return mark;
        }

        /* ---------- storage ---------- */
        function openDB() {
          return new Promise(function (resolve, reject) {
            try {
              var request = indexedDB.open("daily-tasks", 2);
              request.onupgradeneeded = function () {
                var database = request.result;
                ["tasks", "notes"].forEach(function (storeName) {
                  if (!database.objectStoreNames.contains(storeName))
                    database.createObjectStore(storeName, { keyPath: "id" });
                });
              };
              request.onsuccess = function () {
                resolve(request.result);
              };
              request.onerror = function () {
                reject(request.error);
              };
            } catch (error) {
              reject(error);
            }
          });
        }
        function idbAll(database, store) {
          return new Promise(function (resolve) {

                      signedInWith(user) +
                      " for " +
                      ((user && user.email) || "this account") +
                      "."
              )
            );
            return;
          }
          var panel = el("div", "panel");
          groups(list, N.sort).forEach(function (group) {
            var section = el("section", "group"),
              heading = el("h3");
            heading.appendChild(el("span", null, dlabel(group.date)));
            heading.appendChild(
              el(
                "span",
                null,
                group.items.length + (group.items.length === 1 ? " note" : " notes")
              )
            );
            section.appendChild(heading);
            group.items.forEach(function (note) {
              section.appendChild(noteRow(note));
            });
            panel.appendChild(section);
          });
          box.appendChild(panel);
        }
        function noteRow(note) {
          var open = !!N.open[note.id],
            row = el("div", "row" + (open ? " open" : ""));
          var rowHeader = header(open, function () {
            N.open[note.id] = !open;
            renderNotes();
          });
          rowHeader.appendChild(el("span", "nt", note.title));
          rowHeader.appendChild(el("span", "snip", snippet(note.body || "")));
          rowHeader.appendChild(el("span", "when", shortDate(note.date)));
          rowHeader.appendChild(chev());
          row.appendChild(rowHeader);
          if (open) {
            var body = el("div", "rb"),
              textBox = el("div", "txt"),
              actions = el("div", "actions");
            renderText(textBox, note.body || "");
            actions.appendChild(
              iconBtn("edit", "Edit note", function () {
                editor(row, note, "notes", true, renderNotes);
              })
            );
            actions.appendChild(
              iconBtn("del", "Delete note", function () {
                del("notes", note.id);
                drop(notes, note.id);
                renderNotes();
              })
            );
            body.appendChild(textBox);
            body.appendChild(actions);
            row.appendChild(body);
          }
          return row;
        }

        /* ---------- setup ---------- */
        function closeDrawer() {
          document.body.classList.remove("drawer-open");
          var menuButton = $("menuBtn");
          var backdrop = $("backdrop");
          if (menuButton) menuButton.setAttribute("aria-expanded", "false");
          if (backdrop) backdrop.hidden = true;
        }
        function openDrawer() {
          if (!document.body.classList.contains("signed-in")) return;
          document.body.classList.add("drawer-open");
          $("menuBtn").setAttribute("aria-expanded", "true");
          $("backdrop").hidden = false;
        }
        function setView(view) {
          $("tasksView").hidden = view !== "tasks";
          $("notesView").hidden = view !== "notes";
          $("tabTasks").setAttribute("aria-selected", String(view === "tasks"));
          $("tabNotes").setAttribute("aria-selected", String(view === "notes"));
          closeDrawer();
        }
        function widen(state, dateText) {
          var changed = false;
          if (state.from && dateText < state.from) {
            state.from = dateText;
            changed = true;
          }
          if (state.to && dateText > state.to) {
            state.to = dateText;
            changed = true;
          }
          if (changed) {
            state.preset = "custom";
            state.sync();
          }
        }
        function setup() {
          $("ddst").appendChild(
            dd({
              get: function () {
                return composerStatus;
              },
              set: function (value) {
                composerStatus = value;
              },
              items: STAT,
            })
          );
          $("ddfl").appendChild(
            dd({
              ic: IC.tag,
              get: function () {
                return composerFlag;
              },
              set: function (value) {
                composerFlag = value;
              },
              items: FLAGS,
            })
          );
          $("tdate").value = today();
          $("ndate").value = today();
          var flagMenu = dd({
            ic: IC.tag,
            get: function () {
              return T.flag;
            },
            set: function (value) {
              T.flag = value;
              renderTasks();
            },
            items: [{ id: "all", label: "All tags" }].concat(FLAGS),
          });
          var taskSearch = el("input");
          taskSearch.type = "text";
          taskSearch.placeholder = "Search tasks";
          taskSearch.setAttribute("aria-label", "Search tasks");
          taskSearch.oninput = function () {
            T.q = taskSearch.value;
            renderTasks();
          };
          buildBar($("tbar"), T, renderTasks, [taskSearch, flagMenu]);
          var noteSearch = el("input");
          noteSearch.type = "text";
          noteSearch.placeholder = "Search notes";
          noteSearch.setAttribute("aria-label", "Search notes");
          noteSearch.oninput = function () {
            N.q = noteSearch.value;
            renderNotes();
          };
          buildBar($("nbar"), N, renderNotes, [noteSearch]);
          Array.prototype.forEach.call(
            document.querySelectorAll("[data-list]"),
            function (button) {
              button.onclick = function () {
                toggleList($(button.dataset["for"]), button.dataset.list);
              };
            }
          );
          listKeys($("ttext"), function () {
            $("tform").requestSubmit();
          });
          listKeys($("nbody"), function () {
            $("nform").requestSubmit();
          });
          $("tabTasks").onclick = function () {
            if (!user) return;
            setView("tasks");
          };
          $("tabNotes").onclick = function () {
            if (!user) return;
            setView("notes");
          };
          $("menuBtn").onclick = function () {
            if (document.body.classList.contains("drawer-open")) closeDrawer();
            else openDrawer();
          };
          $("backdrop").onclick = closeDrawer;
          $("tform").addEventListener("submit", function (event) {
            event.preventDefault();
            var text = $("ttext").value.trim();
            if (!text) return;
            var now = Date.now(),
              task = {
                id: uid(),
                text: text,
                flag: composerFlag,
                status: composerStatus,
                date: $("tdate").value || today(),
                created: now,
                updated: now,
              };
            tasks.push(task);
            put("tasks", task);
            T.status = "all";
            widen(T, task.date);
            $("ttext").value = "";
            renderTasks();
          });
          $("nform").addEventListener("submit", function (event) {
            event.preventDefault();
            var title = $("ntitle").value.trim();
            if (!title) return;
            var now = Date.now(),
              note = {
                id: uid(),
                title: title,
                body: $("nbody").value.trim(),
                date: $("ndate").value || today(),
                created: now,
                updated: now,
              };
            notes.push(note);
            put("notes", note);
            widen(N, note.date);
            $("ntitle").value = "";
            $("nbody").value = "";
            $("ntitle").focus();
            renderNotes();
          });
        }

        function migrate(list, store) {
          return list.map(function (record) {
            if (!record.date) {
              record.date = ymd(new Date(record.created || Date.now()));
              put(store, record);
            }
            return record;
          });
        }
        function clearAuthForm() {
          $("authEmail").value = "";
          $("authPass").value = "";
          $("authName").value = "";
          $("authErr").hidden = true;
        }
        function personName(account) {
          var name = (account && account.displayName) || "";
          if (name.trim()) return name.trim();
          var email = (account && account.email) || "";
          return email.split("@")[0] || "Account";
        }
        function signedInWith(account) {
          var ids = {};
          ((account && account.providerData) || []).forEach(function (provider) {
            ids[provider.providerId] = true;
          });
          if (ids["google.com"] && ids["password"]) return "email and Google";
          if (ids["google.com"]) return "Google";
          if (ids["password"]) return "email and password";
          return "this sign-in method";
        }
        function hideBoot() {
          $("bootLoader").hidden = true;
        }
        function friendlyAuth(err) {
          var code = err && err.code;
          if (code === "auth/account-exists-with-different-credential")
            return "This email already has a password account. Sign in with email and password to see those tasks. Google is a separate account and starts empty.";
          if (code === "auth/unauthorized-domain")
            return "This site is not an authorized domain in Firebase Authentication.";
          if (
            code === "auth/web-storage-unsupported" ||
            code === "auth/operation-not-supported-in-this-environment"
          )
            return "This browser blocked sign-in storage. Allow cookies for this site, then try again.";
          return (err && err.message) || "Something went wrong.";
        }
        function initials(name) {
          var parts = String(name || "")
            .trim()
            .split(/\s+/)
            .filter(Boolean);
          if (!parts.length) return "?";
          if (parts.length < 2) return parts[0].slice(0, 2).toUpperCase();
          return (
            parts[0].charAt(0) + parts[parts.length - 1].charAt(0)
          ).toUpperCase();
        }
        function closeProfile() {
          $("profileMenu").hidden = true;
          $("topMenu").hidden = true;
          $("accountBtn").setAttribute("aria-expanded", "false");
          $("avatarBtn").setAttribute("aria-expanded", "false");
        }
        function toggleProfile(menu, button, event) {
          event.stopPropagation();
          var willOpen = menu.hidden;
          closeProfile();
          if (!willOpen) return;
          menu.hidden = false;
          button.setAttribute("aria-expanded", "true");
        }
        function signOut() {
          closeProfile();
          clearAuthForm();
          if (typeof firebase === "undefined") return;
          firebase.auth().signOut();
        }
        function showAuth() {
          closeProfile();
          closeDrawer();
          document.body.classList.remove("signed-in");
          $("authView").hidden = false;
          $("tasksView").hidden = true;
          $("notesView").hidden = true;
          $("account").hidden = true;
          $("topAccount").hidden = true;
          $("menuBtn").hidden = true;
          $("navLogin").hidden = false;
          $("tabs").hidden = true;
          $("foot").textContent =
            "Sign in to sync this account across devices.";
        }
        function showApp(account) {
          var name = personName(account);
          var letters = initials(name);
          closeProfile();
          document.body.classList.add("signed-in");
          $("authView").hidden = true;
          $("authErr").hidden = true;
          $("navLogin").hidden = true;
          $("account").hidden = false;
          $("topAccount").hidden = false;
          $("menuBtn").hidden = false;
          $("tabs").hidden = false;
          $("avatarBtn").textContent = letters;
          $("avatarBtn").title = name;
          $("sideInitials").textContent = letters;
          $("profileName").textContent = name;
          $("topName").textContent = name;
          $("accountEmail").textContent = account.email || "";
          $("topEmail").textContent = account.email || "";
          $("foot").textContent = ready
            ? "Signed in. This account stays in sync across devices."
            : "Loading your tasks and notes…";
          setView(
            $("tabNotes").getAttribute("aria-selected") === "true"
              ? "notes"
              : "tasks"
          );
        }
        function authError(err) {
          $("authErr").hidden = false;
          $("authErr").textContent = friendlyAuth(err);
        }
        function configured() {
          var c = window.FIREBASE_CONFIG || {};
          return !!(c.apiKey && c.projectId && typeof firebase !== "undefined");
        }
        var signingUp = false;
        function paintAuth() {
          $("authTitle").textContent = signingUp ? "Create account" : "Sign in";
          $("authLead").textContent = signingUp
            ? "Create an account with email, or continue with Google."
            : "Use your email or Google. This account syncs on every device.";
          $("authSubmit").textContent = signingUp
            ? "Create account"
            : "Sign in";
          $("authToggle").textContent = signingUp
            ? "Have an account? Sign in"
            : "Create account";
          $("authReset").hidden = signingUp;
          $("nameField").hidden = !signingUp;
          $("authName").required = signingUp;
          $("authPass").setAttribute(
            "autocomplete",
            signingUp ? "new-password" : "current-password"
          );
        }
        function signInGoogle() {
          if (!configured()) return;
          $("authErr").hidden = true;
          var provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          var auth = firebase.auth();
          auth.signInWithPopup(provider).catch(function (err) {
            if (
              err &&
              (err.code === "auth/popup-closed-by-user" ||
                err.code === "auth/cancelled-popup-request")
            )
              return;
            if (
              err &&
              (err.code === "auth/popup-blocked" ||
                err.code === "auth/operation-not-supported-in-this-environment")
            ) {
              authError({
                message:
                  "The sign-in window was blocked. Allow popups for this site and try Google again. If your tasks were created with email and password, use that instead. Google is a separate account.",
              });
              return;
            }
            authError(err);
          });
        }
        function bindAuth() {
          $("authToggle").onclick = function () {
            signingUp = !signingUp;
            $("authErr").hidden = true;
            paintAuth();
          };
          $("authReset").onclick = function () {
            var email = $("authEmail").value.trim();
            if (!email) {
              authError({
                message: "Enter your email, then choose Forgot password.",
              });
              return;
            }
            firebase
              .auth()
              .sendPasswordResetEmail(email)
              .then(function () {
                authError({ message: "Password reset email sent." });
              })
              .catch(authError);
          };
          $("authForm").addEventListener("submit", function (event) {
            event.preventDefault();
            if (!configured()) return;
            $("authErr").hidden = true;
            var email = $("authEmail").value.trim(),
              password = $("authPass").value,
              name = $("authName").value.trim(),
              auth = firebase.auth(),
              pendingSignIn;
            if (signingUp && !name) {
              authError({ message: "Enter your full name." });
              return;
            }
            pendingSignIn = signingUp
              ? auth
                  .createUserWithEmailAndPassword(email, password)
                  .then(function (credential) {
                    return credential.user.updateProfile({ displayName: name });
                  })
                  .then(function () {
                    var current = firebase.auth().currentUser;
                    if (current) showApp(current);
                  })
              : auth.signInWithEmailAndPassword(email, password);
            pendingSignIn.catch(authError);
          });
          $("authGoogle").onclick = signInGoogle;
          $("navLogin").onclick = function () {
            signingUp = false;
            paintAuth();
            showAuth();
            $("authEmail").focus();
          };
          $("avatarBtn").onclick = function (event) {
            toggleProfile($("topMenu"), $("avatarBtn"), event);
          };
          $("accountBtn").onclick = function (event) {
            toggleProfile($("profileMenu"), $("accountBtn"), event);
          };
          document.addEventListener("click", closeProfile);
          $("signOut").onclick = function (event) {
            event.stopPropagation();
            signOut();
          };
          $("signOutTop").onclick = function (event) {
            event.stopPropagation();
            signOut();
          };
        }
        function boot() {
          setup();
          bindAuth();
          paintAuth();
          if (!configured()) {
            hideBoot();
            showAuth();
            authError({
              message:
                "Add your Firebase web config in firebase-config.js before signing in.",
            });
            $("foot").textContent = "Firebase is not configured yet.";
            return;
          }
          firebase.initializeApp(window.FIREBASE_CONFIG);
          fs = firebase.firestore();
          try {
            fs.settings({ useFetchStreams: false });
          } catch (e) {}
          firebase.auth().onAuthStateChanged(function (account) {
            if (authSettled && account && user && account.uid === user.uid) {
              user = account;
              showApp(account);
              return;
            }
            var mine = ++session;
            authSettled = true;
            uploadStarted = false;
            stopListen();
            user = account;
            tasks = [];
            notes = [];
            pending = { tasks: {}, notes: {} };
            dropped = { tasks: {}, notes: {} };
            cloudCount = { tasks: 0, notes: 0 };
            restCount = { tasks: 0, notes: 0 };
            liveSeen = { tasks: false, notes: false };
            loadProblem = "";
            ready = false;
            hideBoot();
            if (!account) {
              clearAuthForm();
              showAuth();
              return;
            }
            showApp(account);
            renderTasks();
            renderNotes();
            if (mine !== session) return;
            listen();
          });
          firebase
            .auth()
            .getRedirectResult()
            .catch(function (err) {
              if (!firebase.auth().currentUser) {
                hideBoot();
                showAuth();
              }
              authError(err);
            });
        }
        boot();
      })();
    </script>
  </body>
</html>
