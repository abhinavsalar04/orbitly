<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Orbitly – Bring your tasks and notes into orbit</title>
    <link rel="icon" href="orbitly-mark.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --bg: #eceeec;
        --surface: #f8f9f8;
        --raised: #ffffff;
        --foot: #f0f2f0;
        --line: #d9ddda;
        --ink: #242a2b;
        --muted: #768083;
        --green: #27a33e;
        --s-todo: #6f7c84;
        --s-progress: #3a7fd0;
        --s-pending: #a97c0a;
        --s-done: #1f8f35;
        --f-backend: #4f9cf0;
        --f-frontend: #f2c14e;
        --f-swag: #f08a5d;
        --f-cert: #b48cf2;
        --f-h2s: #3fc7b0;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #101012;
          --surface: #17171a;
          --raised: #202024;
          --foot: #1b1b1f;
          --line: #2a2a2f;
          --ink: #e8e8ea;
          --muted: #8e8e96;
          --s-todo: #9aa6ad;
          --s-progress: #6fb0f5;
          --s-pending: #e6b84a;
          --s-done: #4cc265;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #101012;
        --surface: #17171a;
        --raised: #202024;
        --foot: #1b1b1f;
        --line: #2a2a2f;
        --ink: #e8e8ea;
        --muted: #8e8e96;
        --s-todo: #9aa6ad;
        --s-progress: #6fb0f5;
        --s-pending: #e6b84a;
        --s-done: #4cc265;
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 "Manrope", system-ui, -apple-system, "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 22px 18px 64px;
      }
      svg {
        flex: none;
      }
      .nav {
        position: sticky;
        top: 0;
        z-index: 40;
        padding-top: env(safe-area-inset-top, 0px);
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(10px);
      }
      .navin {
        max-width: 900px;
        margin: 0 auto;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .mark {
        width: 46px;
        height: 46px;
        display: block;
        flex: none;
      }
      .brandtext {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
        margin: 0;
      }
      h1 .ly {
        color: #2cac74;
      }
      .tag {
        color: #2b8961;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.2;
        margin-top: 2px;
        white-space: nowrap;
      }
      .tabs {
        display: inline-flex;
        gap: 4px;
        padding: 4px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .tab {
        border: 0;
        border-radius: 9px;
        padding: 7px 18px;
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
      }
      .tab[aria-selected="true"] {
        background: var(--raised);
        color: var(--green);
      }
      .headside {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }
      .navlogin {
        height: 36px;
        padding: 0 14px;
        background: var(--green);
        border-color: var(--green);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
      }
      .navlogin:hover {
        filter: brightness(1.1);
        border-color: var(--green);
      }
      .profile {
        position: relative;
      }
      .avatar {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--green);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .avatar:hover {
        filter: brightness(1.1);
        border-color: transparent;
      }
      .pmenu {
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        min-width: 210px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
        z-index: 50;
      }
      .pname {
        font-weight: 700;
        font-size: 14px;
        padding: 6px 8px 0;
      }
      .pemail {
        color: var(--muted);
        font-size: 12.5px;
        padding: 2px 8px 8px;
        overflow-wrap: anywhere;
      }
      .pmenu .out {
        width: 100%;
        height: 34px;
        font-size: 13px;
        font-weight: 600;
      }
      .auth {
        max-width: 420px;
        margin: 8px auto 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px 22px 18px;
      }
      .auth:focus-within {
        border-color: var(--green);
      }
      .auth h2 {
        margin: 0 0 6px;
        padding: 0;
        font-size: 22px;
        font-weight: 700;
      }
      .authlead {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 13.5px;
      }
      .fld {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .fld input {
        height: 42px;
        padding: 0 12px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 9px;
        font-weight: 500;
      }
      .fld input:focus {
        outline: none;
        border-color: var(--green);
      }
      button.authgo {
        display: flex;
        width: 100%;
        height: 42px;
        justify-content: center;
        margin-top: 4px;
      }
      .authlinks {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
      }
      .authlinks button {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 4px 0;
        font-size: 13px;
        font-weight: 600;
      }
      .authlinks button:hover {
        color: var(--ink);
        border-color: transparent;
      }
      .or {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 16px 0 12px;
        color: var(--muted);
        font-size: 12px;
      }
      .or::before,
      .or::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .google {
        display: flex;
        width: 100%;
        height: 42px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: var(--raised);
        font-weight: 600;
      }
      .google svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .autherr {
        margin: 0 0 10px;
        padding: 0;
        color: #d4533e;
        font-size: 13px;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="date"],
      textarea,
      select {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        min-width: 0;
      }
      textarea {
        width: 100%;
        resize: vertical;
        line-height: 1.5;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 8px 12px;
      }
      button:hover {
        border-color: var(--muted);
      }
      :focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }
      .muted {
        color: var(--muted);
      }
      .vr {
        width: 1px;
        height: 20px;
        background: var(--line);
        flex: none;
      }
      .ico {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .composer {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .composer:focus-within {
        border-color: var(--green);
      }
      .composer .in {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 16px 18px;
        outline: none;
        resize: none;
      }
      .composer textarea.in {
        min-height: 120px;
      }
      .composer input.in {
        font-weight: 600;
        padding-bottom: 0;
      }
      .cfoot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        background: var(--foot);
      }
      .cfoot .sp {
        flex: 1;
      }
      .dd {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 0 11px;
        height: 34px;
        font-size: 13px;
        font-weight: 600;
      }
      .dd .ico {
        color: var(--muted);
      }
      .dd .chv {
        opacity: 0.6;
        width: 14px;
        height: 14px;
      }
      .dfield {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
      }
      .dfield .ico {
        color: var(--muted);
        pointer-events: none;
      }
      .dfield input,
      .rng input {
        border: 0;
        background: transparent;
        padding: 0;
        font-size: 13px;
        border-radius: 0;
        position: relative;
        width: 96px;
        outline: none;
      }
      input[type="date"]::-webkit-calendar-picker-indicator {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
      button.add {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--green);
        border-color: var(--green);
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        height: 36px;
        padding: 0 16px;
      }
      button.add:hover {
        filter: brightness(1.1);
        border-color: var(--green);
      }
      .ib {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid transparent;
        color: var(--muted);
      }
      .ib svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ib:hover {
        color: var(--green);
        border-color: var(--line);
        background: var(--surface);
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .stat {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 6px 5px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .stat .ico {
        color: var(--muted);
      }
      .stat .n {
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--raised);
        border: 1px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .stat[aria-pressed="true"] {
        border-color: var(--green);
        color: var(--green);
      }
      .stat[aria-pressed="true"] .ico {
        color: var(--green);
      }
      .fbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      .fbar input[type="text"] {
        flex: 1 1 180px;
        height: 36px;
        border-radius: 9px;
        background: var(--surface);
      }
      .rng {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 12px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 9px;
        font-size: 13px;
      }
      .rng .ico {
        color: var(--muted);
        pointer-events: none;
      }
      .fbar .dd {
        height: 36px;
        background: var(--surface);
      }
      .menu {
        position: fixed;
        z-index: 50;
        min-width: 170px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 4px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
      }
      .menu button {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 7px;
        padding: 7px 10px;
        text-align: left;
        font-size: 13px;
      }
      .menu button:hover,
      .menu button[aria-selected="true"] {
        background: color-mix(in srgb, var(--ink) 8%, transparent);
      }
      .menu .ico {
        color: var(--muted);
      }

      .pill,
      .fpill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.4;
      }
      .pill {
        --c: var(--s-todo);
        color: var(--c);
        background: transparent;
        border: 1px solid var(--line);
        padding: 2px 10px;
      }
      .st-todo {
        --c: var(--s-todo);
      }
      .st-progress {
        --c: var(--s-progress);
      }
      .st-pending {
        --c: var(--s-pending);
      }
      .st-done {
        --c: var(--s-done);
      }
      select.pill {
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
      }
      select.pill option {
        color: var(--ink);
        background: var(--raised);
      }
      .fpill {
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 2px 10px;
        font-weight: 500;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c, var(--muted));
        flex: none;
      }

      .panel {
        background: transparent;
        border: 0;
        overflow: visible;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .group + .group {
        margin-top: 14px;
      }
      .group h3 {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 0;
        padding: 4px 4px 0;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .row {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .rh {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 16px;
        cursor: pointer;
      }
      .row.open .rh {
        padding-bottom: 8px;
      }
      .row:not(.open) .rh:hover {
        border-radius: 12px;
      }
      .row.open .rh:hover {
        border-radius: 12px 12px 0 0;
      }
      .rh:hover {
        background: color-mix(in srgb, var(--ink) 4%, transparent);
      }
      .meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .meta + .chev {
        margin-left: 0;
      }
      .lead,
      .snip {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nt {
        flex: 0 1 auto;
        max-width: 45%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
      }
      .nt + .snip {
        color: var(--muted);
      }
      .when {
        flex: none;
        margin-left: auto;
        color: var(--muted);
        font-size: 12.5px;
      }
      .snip + .when {
        margin-left: 0;
      }
      .chev {
        flex: none;
        margin-left: auto;
        color: var(--muted);
        display: inline-flex;
        transition: transform 0.15s;
      }
      .when + .chev {
        margin-left: 0;
      }
      .row.open .chev {
        transform: rotate(180deg);
      }
      .row.open .snip {
        display: none;
      }
      .row.open .nt {
        flex: 1;
        max-width: none;
      }
      .rb {
        display: none;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
        padding: 2px 16px 16px;
      }
      .row.open .rb {
        display: flex;
      }
      .rb textarea {
        flex: 1;
      }
      .txt {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .txt p {
        margin: 0 0 4px;
      }
      .txt ul,
      .txt ol {
        margin: 0 0 4px;
        padding-left: 22px;
      }
      .txt ul {
        list-style: disc;
      }
      .txt ol {
        list-style: decimal;
      }
      .txt li {
        margin: 2px 0;
      }
      .actions {
        display: flex;
        gap: 2px;
        flex: none;
      }
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 52px 16px;
        border: 1px dashed var(--line);
        border-radius: 14px;
        color: var(--muted);
        text-align: center;
      }
      .empty .circ {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--surface);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .empty .ico {
        width: 22px;
        height: 22px;
      }
      .gate {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 72px 16px;
        color: var(--muted);
        text-align: center;
      }
      .gate p {
        margin: 0;
        font-size: 14px;
      }
      .gate-list {
        padding: 48px 16px;
        border: 1px dashed var(--line);
        border-radius: 14px;
      }
      .spin {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid var(--line);
        border-top-color: var(--green);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spin {
          animation: none;
        }
      }
      footer {
        margin-top: 24px;
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 560px) {
        .ib {
          width: 36px;
          height: 36px;
        }
        .cfoot .sp {
          display: none;
        }
        .tag {
          display: none;
        }
        .mark {
          width: 36px;
          height: 36px;
        }
        h1 {
          font-size: 18px;
        }
        .navin {
          padding: 10px 12px;
          gap: 8px;
          flex-wrap: nowrap;
        }
        .headside {
          flex-wrap: nowrap;
          gap: 6px;
        }
        .tab {
          padding: 6px 10px;
        }
        .avatar {
          width: 32px;
          height: 32px;
        }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <div class="navin">
        <div class="brand">
          <img
            class="mark"
            src="orbitly-mark.png"
            alt=""
            width="46"
            height="46"
          />
          <div class="brandtext">
            <h1 aria-label="Orbitly">Orbit<span class="ly">ly</span></h1>
            <div class="tag">Bring your tasks and notes into orbit</div>
          </div>
        </div>
        <div class="headside">
          <div class="tabs" id="tabs" role="tablist" hidden>
            <button
              type="button"
              class="tab"
              id="tabTasks"
              role="tab"
              aria-selected="true"
            >
              Tasks
            </button>
            <button
              type="button"
              class="tab"
              id="tabNotes"
              role="tab"
              aria-selected="false"
            >
              Notes
            </button>
          </div>
          <button type="button" class="navlogin" id="navLogin" hidden>
            Sign in
          </button>
          <div class="profile" id="account" hidden>
            <button

        /* ---------- storage ---------- */
        function openDB() {

            .doc(key)

          if (!user || !fs || !id) return Promise.resolve();
          var key = String(id);

            .doc(key)
            .delete()
            .then(function () {

            .catch(function (err) {

            delete byId[id];

        function loadError(err) {

            p = signingUp
              ? auth
                  .createUserWithEmailAndPassword(email, pass)
                  .then(function (cred) {
                    return cred.user.updateProfile({ displayName: name });
                  })
                  .then(function () {
                    var current = firebase.auth().currentUser;
                    if (current) showApp(current);
                  })
              : auth.signInWithEmailAndPassword(email, pass);
            p.catch(authError);
          });
          $("authGoogle").onclick = signInGoogle;
          $("navLogin").onclick = function () {
            signingUp = false;
            paintAuth();
            showAuth();
            $("authEmail").focus();
          };
          $("avatarBtn").onclick = function (e) {
            e.stopPropagation();
            var open = $("profileMenu").hidden;
            $("profileMenu").hidden = !open;
            $("avatarBtn").setAttribute("aria-expanded", String(open));
          };
          document.addEventListener("click", closeProfile);
          $("signOut").onclick = function (e) {
            e.stopPropagation();
            closeProfile();
            clearAuthForm();
            if (typeof firebase === "undefined") return;
            firebase.auth().signOut();
          };
        }
        function boot() {
          setup();
          bindAuth();
          paintAuth();
          if (!configured()) {
            hideBoot();
            showAuth();
            authError({
              message:
                "Add your Firebase web config in firebase-config.js before signing in.",
            });
            $("foot").textContent = "Firebase is not configured yet.";
            return;
          }
          firebase.initializeApp(window.FIREBASE_CONFIG);
          fs = firebase.firestore();
          try {
            fs.settings({ useFetchStreams: false });
          } catch (e) {}
          firebase.auth().onAuthStateChanged(function (u) {
            if (authSettled && u && user && u.uid === user.uid) {
              user = u;
              showApp(u);
              return;
            }
            var mine = ++session;
            authSettled = true;
            uploadStarted = false;
            stopListen();
            user = u;
            tasks = [];
            notes = [];
            pending = { tasks: {}, notes: {} };
            dropped = { tasks: {}, notes: {} };
            cloudCount = { tasks: 0, notes: 0 };
            restCount = { tasks: 0, notes: 0 };
            liveSeen = { tasks: false, notes: false };
            loadProblem = "";
            ready = false;
            hideBoot();
            if (!u) {
              clearAuthForm();
              showAuth();
              return;
            }
            showApp(u);
            renderTasks();
            renderNotes();
            if (mine !== session) return;
            listen();
          });
          firebase
            .auth()
            .getRedirectResult()
            .catch(function (err) {
              if (!firebase.auth().currentUser) {
                hideBoot();
                showAuth();
              }
              authError(err);
            });
        }
        boot();
      })();
    </script>
  </body>
</html>
