<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Orbitly – Bring your tasks and notes into orbit</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --bg: #eceeec;
        --surface: #f8f9f8;
        --raised: #ffffff;
        --foot: #f0f2f0;
        --line: #d9ddda;
        --ink: #242a2b;
        --muted: #768083;
        --green: #27a33e;
        --s-todo: #6f7c84;
        --s-progress: #3a7fd0;
        --s-pending: #a97c0a;
        --s-done: #1f8f35;
        --f-backend: #4f9cf0;
        --f-frontend: #f2c14e;
        --f-swag: #f08a5d;
        --f-cert: #b48cf2;
        --f-h2s: #3fc7b0;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #101012;
          --surface: #17171a;
          --raised: #202024;
          --foot: #1b1b1f;
          --line: #2a2a2f;
          --ink: #e8e8ea;
          --muted: #8e8e96;
          --s-todo: #9aa6ad;
          --s-progress: #6fb0f5;
          --s-pending: #e6b84a;
          --s-done: #4cc265;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #101012;
        --surface: #17171a;
        --raised: #202024;
        --foot: #1b1b1f;
        --line: #2a2a2f;
        --ink: #e8e8ea;
        --muted: #8e8e96;
        --s-todo: #9aa6ad;
        --s-progress: #6fb0f5;
        --s-pending: #e6b84a;
        --s-done: #4cc265;
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 "Manrope", system-ui, -apple-system, "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px 18px 64px;
      }
      svg {
        flex: none;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 22px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand svg {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: var(--green);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin: 0;
      }
      .tag {
        color: var(--muted);
        font-size: 14px;
        margin-top: 2px;
      }
      .tabs {
        display: inline-flex;
        gap: 4px;
        padding: 4px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .tab {
        border: 0;
        border-radius: 9px;
        padding: 7px 18px;
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
      }
      .tab[aria-selected="true"] {
        background: var(--raised);
        color: var(--green);
      }
      input[type="text"],
      input[type="date"],
      textarea,
      select {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        min-width: 0;
      }
      textarea {
        width: 100%;
        resize: vertical;
        line-height: 1.5;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 8px 12px;
      }
      button:hover {
        border-color: var(--muted);
      }
      :focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }
      .muted {
        color: var(--muted);
      }
      .vr {
        width: 1px;
        height: 20px;
        background: var(--line);
        flex: none;
      }
      .ico {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .composer {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .composer:focus-within {
        border-color: var(--green);
      }
      .composer .in {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 16px 18px;
        outline: none;
        resize: none;
      }
      .composer textarea.in {
        min-height: 120px;
      }
      .composer input.in {
        font-weight: 600;
        padding-bottom: 0;
      }
      .cfoot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        background: var(--foot);
      }
      .cfoot .sp {
        flex: 1;
      }
      .dd {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 0 11px;
        height: 34px;
        font-size: 13px;
        font-weight: 600;
      }
      .dd .ico {
        color: var(--muted);
      }
      .dd .chv {
        opacity: 0.6;
        width: 14px;
        height: 14px;
      }
      .dfield {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
      }
      .dfield .ico {
        color: var(--muted);
        pointer-events: none;
      }
      .dfield input,
      .rng input {
        border: 0;
        background: transparent;
        padding: 0;
        font-size: 13px;
        border-radius: 0;
        position: relative;
        width: 96px;
        outline: none;
      }
      input[type="date"]::-webkit-calendar-picker-indicator {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
      button.add {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--green);
        border-color: var(--green);
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        height: 36px;
        padding: 0 16px;
      }
      button.add:hover {
        filter: brightness(1.1);
        border-color: var(--green);
      }
      .ib {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid transparent;
        color: var(--muted);
      }
      .ib svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ib:hover {
        color: var(--green);
        border-color: var(--line);
        background: var(--surface);
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .stat {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 6px 5px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .stat .ico {
        color: var(--muted);
      }
      .stat .n {
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--raised);
        border: 1px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .stat[aria-pressed="true"] {
        border-color: var(--green);
        color: var(--green);
      }
      .stat[aria-pressed="true"] .ico {
        color: var(--green);
      }
      .fbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      .fbar input[type="text"] {
        flex: 1 1 180px;
        height: 36px;
        border-radius: 9px;
        background: var(--surface);
      }
      .rng {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 12px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 9px;
        font-size: 13px;
      }
      .rng .ico {
        color: var(--muted);
        pointer-events: none;
      }
      .fbar .dd {
        height: 36px;
        background: var(--surface);
      }
      .menu {
        position: fixed;
        z-index: 50;
        min-width: 170px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 4px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
      }
      .menu button {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 7px;
        padding: 7px 10px;
        text-align: left;
        font-size: 13px;
      }
      .menu button:hover,
      .menu button[aria-selected="true"] {
        background: color-mix(in srgb, var(--ink) 8%, transparent);
      }
      .menu .ico {
        color: var(--muted);
      }

      .pill,
      .fpill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.4;
      }
      .pill {
        --c: var(--s-todo);
        color: var(--c);
        background: transparent;
        border: 1px solid var(--line);
        padding: 2px 10px;
      }
      .st-todo {
        --c: var(--s-todo);
      }
      .st-progress {
        --c: var(--s-progress);
      }
      .st-pending {
        --c: var(--s-pending);
      }
      .st-done {
        --c: var(--s-done);
      }
      select.pill {
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
      }
      select.pill option {
        color: var(--ink);
        background: var(--raised);
      }
      .fpill {
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 2px 10px;
        font-weight: 500;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c, var(--muted));
        flex: none;
      }

      .panel {
        background: transparent;
        border: 0;
        overflow: visible;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .group + .group {
        margin-top: 14px;
      }
      .group h3 {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 0;
        padding: 4px 4px 0;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .row {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .rh {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 16px;
        cursor: pointer;
      }
      .row.open .rh {
        padding-bottom: 8px;
      }
      .row:not(.open) .rh:hover {
        border-radius: 12px;
      }
      .row.open .rh:hover {
        border-radius: 12px 12px 0 0;
      }
      .rh:hover {
        background: color-mix(in srgb, var(--ink) 4%, transparent);
      }
      .meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .meta + .chev {
        margin-left: 0;
      }
      .lead,
      .snip {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nt {
        flex: 0 1 auto;
        max-width: 45%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
      }
      .nt + .snip {
        color: var(--muted);
      }
      .when {
        flex: none;
        margin-left: auto;
        color: var(--muted);
        font-size: 12.5px;
      }
      .snip + .when {
        margin-left: 0;
      }
      .chev {
        flex: none;
        margin-left: auto;
        color: var(--muted);
        display: inline-flex;
        transition: transform 0.15s;
      }
      .when + .chev {
        margin-left: 0;
      }
      .row.open .chev {
        transform: rotate(180deg);
      }
      .row.open .snip {
        display: none;
      }
      .row.open .nt {
        flex: 1;
        max-width: none;
      }
      .rb {
        display: none;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
        padding: 2px 16px 16px;
      }
      .row.open .rb {
        display: flex;
      }
      .rb textarea {
        flex: 1;
      }
      .txt {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .txt p {
        margin: 0 0 4px;
      }
      .txt ul,
      .txt ol {
        margin: 0 0 4px;
        padding-left: 22px;
      }
      .txt ul {
        list-style: disc;
      }
      .txt ol {
        list-style: decimal;
      }
      .txt li {
        margin: 2px 0;
      }
      .actions {
        display: flex;
        gap: 2px;
        flex: none;
      }
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 52px 16px;
        border: 1px dashed var(--line);
        border-radius: 14px;
        color: var(--muted);
        text-align: center;
      }
      .empty .circ {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--surface);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .empty .ico {
        width: 22px;
        height: 22px;
      }
      footer {
        margin-top: 24px;
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 560px) {
        .ib {
          width: 36px;
          height: 36px;
        }
        .cfoot .sp {
          display: none;
        }
        .top {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="top">
        <div>
          <div class="brand">
            <!-- <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"
              />
              <path
                d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"
              />
              <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
              <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
            </svg> -->
            <h1>Orbitly</h1>
          </div>
          <div class="tag">Bring your tasks and notes into orbit</div>
        </div>
        <div class="tabs" role="tablist">
          <button
            type="button"
            class="tab"
            id="tabTasks"
            role="tab"
            aria-selected="true"
          >
            Tasks
          </button>
          <button
            type="button"
            class="tab"
            id="tabNotes"
            role="tab"
            aria-selected="false"
          >
            Notes
          </button>
        </div>
      </header>

      <section id="tasksView">
        <form id="tform" class="composer" autocomplete="off">
          <textarea
            class="in"
            id="ttext"
            placeholder="What needs doing? Use - or 1. for lists. Ctrl+Enter adds."
            aria-label="Task"
            required
            maxlength="3000"
          ></textarea>
          <div class="cfoot">
            <span id="ddst"></span><span id="ddfl"></span>
            <span class="vr"></span>
            <label class="dfield" title="Task date"
              ><svg class="ico" viewBox="0 0 24 24">
                <rect x="4" y="5" width="16" height="15" rx="2" />
                <path d="M4 10h16M9 3v4M15 3v4" /></svg
              ><input type="date" id="tdate" aria-label="Task date"
            /></label>
            <span class="vr"></span>
            <button
              type="button"
              class="ib"
              data-list="ul"
              data-for="ttext"
              title="Bulleted list"
              aria-label="Bulleted list"
            >
              <svg viewBox="0 0 24 24">
                <path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" />
              </svg>
            </button>
            <button
              type="button"
              class="ib"
              data-list="ol"
              data-for="ttext"
              title="Numbered list"
              aria-label="Numbered list"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M10 6h10M10 12h10M10 18h10M4 5l1.5-1v5M3.5 14.5h3l-3 3.5h3"
                />
              </svg>
            </button>
            <span class="sp"></span>
            <button class="add" type="submit">
              <svg class="ico" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" /></svg
              >Add task
            </button>
          </div>
        </form>
        <div class="stats" id="stats"></div>
        <div class="fbar" id="tbar"></div>
        <div id="tlist"></div>
      </section>

      <section id="notesView" hidden>
        <form id="nform" class="composer" autocomplete="off">
          <input
            type="text"
            class="in"
            id="ntitle"
            placeholder="Note title"
            aria-label="Note title"
            required
            maxlength="120"
          />
          <textarea
            class="in"
            id="nbody"
            placeholder="Write your note. Use - or 1. for lists. Ctrl+Enter adds."
            aria-label="Note"
            maxlength="10000"
          ></textarea>
          <div class="cfoot">
            <label class="dfield" title="Note date"
              ><svg class="ico" viewBox="0 0 24 24">
                <rect x="4" y="5" width="16" height="15" rx="2" />
                <path d="M4 10h16M9 3v4M15 3v4" /></svg
              ><input type="date" id="ndate" aria-label="Note date"
            /></label>
            <span class="vr"></span>
            <button
              type="button"
              class="ib"
              data-list="ul"
              data-for="nbody"
              title="Bulleted list"
              aria-label="Bulleted list"
            >
              <svg viewBox="0 0 24 24">
                <path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" />
              </svg>
            </button>
            <button
              type="button"
              class="ib"
              data-list="ol"
              data-for="nbody"
              title="Numbered list"
              aria-label="Numbered list"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M10 6h10M10 12h10M10 18h10M4 5l1.5-1v5M3.5 14.5h3l-3 3.5h3"
                />
              </svg>
            </button>
            <span class="sp"></span>
            <button class="add" type="submit">
              <svg class="ico" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" /></svg
              >Add note
            </button>
          </div>
        </form>
        <div class="fbar" id="nbar"></div>
        <div id="nlist"></div>
      </section>
      <footer id="foot">Saved in this browser only.</footer>
    </main>

    <script>
      (function () {
        var FLAGS = [
          { id: "backend", l: "Backend", dot: "var(--f-backend)" },
          { id: "frontend", l: "Frontend", dot: "var(--f-frontend)" },
          { id: "swag", l: "Swag store", dot: "var(--f-swag)" },
          { id: "certificate", l: "Certificate", dot: "var(--f-cert)" },
          { id: "h2s", l: "hello.h2s", dot: "var(--f-h2s)" },
        ];
        var IC = {
          list: '<path d="M11 6h9M11 12h9M11 18h9M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/>',
          dash: '<circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>',
          clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
          chk: '<circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
          tag: '<path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',
          cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
          sort: '<path d="M8 5v14M5 16l3 3 3-3M16 19V5M13 8l3-3 3 3"/>',
          inbox: '<path d="M4 13l2-8h12l2 8M4 13v6h16v-6M4 13h5l1 2h4l1-2h5"/>',

              renderTasks();
            },
            items: [{ id: "all", l: "All flags" }].concat(FLAGS),
          });
          buildBar($("tbar"), T, renderTasks, [fl]);
          var sq = el("input");
          sq.type = "text";
          sq.placeholder = "Search notes";
          sq.setAttribute("aria-label", "Search notes");
          sq.oninput = function () {
            N.q = sq.value;
            renderNotes();
          };
          buildBar($("nbar"), N, renderNotes, [sq]);
          Array.prototype.forEach.call(
            document.querySelectorAll("[data-list]"),
            function (b) {
              b.onclick = function () {
                toggleList($(b.dataset["for"]), b.dataset.list);
              };
            }
          );
          listKeys($("ttext"), function () {
            $("tform").requestSubmit();
          });
          listKeys($("nbody"), function () {
            $("nform").requestSubmit();
          });
          $("tabTasks").onclick = function () {
            setView("tasks");
          };
          $("tabNotes").onclick = function () {
            setView("notes");
          };
          $("tform").addEventListener("submit", function (e) {
            e.preventDefault();
            var v = $("ttext").value.trim();
            if (!v) return;
            var now = Date.now(),
              t = {
                id: uid(),
                text: v,
                flag: cf,
                status: cs,
                date: $("tdate").value || today(),
                created: now,
                updated: now,
              };
            tasks.push(t);
            put("tasks", t);
            T.status = "all";
            widen(T, t.date);
            $("ttext").value = "";
            renderTasks();
          });
          $("nform").addEventListener("submit", function (e) {
            e.preventDefault();
            var t = $("ntitle").value.trim();
            if (!t) return;
            var now = Date.now(),
              n = {
                id: uid(),
                title: t,
                body: $("nbody").value.trim(),
                date: $("ndate").value || today(),
                created: now,
                updated: now,
              };
            notes.push(n);
            put("notes", n);
            widen(N, n.date);
            $("ntitle").value = "";
            $("nbody").value = "";
            $("ntitle").focus();
            renderNotes();
          });
        }

        function migrate(list, store) {
          return list.map(function (x) {
            if (!x.date) {
              x.date = ymd(new Date(x.created || Date.now()));
              put(store, x);
            }
            return x;
          });
        }
        function finish() {
          ready = true;
          renderTasks();
          renderNotes();
        }
        setup();
        openDB()
          .then(function (d) {
            db = d;
            return getAll("tasks");
          })
          .then(function (a) {
            tasks = migrate(a, "tasks");
            return getAll("notes");
          })
          .then(function (a) {
            notes = migrate(a, "notes");
            finish();
          })
          .catch(function () {
            warn();
            finish();
          });
      })();
    </script>
  </body>
</html>
