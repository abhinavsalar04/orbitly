<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily tasks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#eceeec; --surface:#f8f9f8; --line:#d9ddda; --ink:#242a2b; --muted:#768083; --accent:#4f6b66; --green:#27a33e;
  --f-backend:#4f9cf0; --f-frontend:#f2c14e; --f-swag:#f08a5d; --f-cert:#b48cf2; --f-h2s:#3fc7b0;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1f20; --surface:#232829; --line:#343b3c; --ink:#e3e7e5; --muted:#8c9799; --accent:#8fb0a9; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1f20; --surface:#232829; --line:#343b3c; --ink:#e3e7e5; --muted:#8c9799; --accent:#8fb0a9; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1080px;margin:0 auto;padding:40px 20px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.date{color:var(--muted);margin-top:2px}
.stats{color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-weight:600}
.daynav{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.daynav input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.daynav button{padding:7px 12px}

form{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
.compose{flex:1 1 280px;display:flex;flex-direction:column;gap:4px}
textarea{resize:vertical;min-height:72px;line-height:1.5;width:100%}
.tools{display:flex;align-items:center;gap:2px}
.hint{margin-left:8px;color:var(--muted);font-size:12.5px}
form{align-items:flex-start}
.txt{flex:1;min-width:0}
.txt ul,.txt ol{margin:4px 0 0;padding-left:20px}
.txt ul{list-style:disc}
.txt ol{list-style:decimal}
.txt li{margin:2px 0}
.tabs{display:inline-flex;gap:4px;padding:3px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tab{border:0;padding:6px 18px;color:var(--muted);font-weight:600}
.tab[aria-selected=true]{background:var(--green);color:#fff}
body[data-view=notes] .task-only{display:none!important}
body[data-view=tasks] .notes-only{display:none}
.search{width:100%;margin:18px 0 16px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.note h3{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.note .nh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.note .when{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
.notes .empty{grid-column:1/-1}
select{flex:0 0 auto}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px}
button:hover{border-color:var(--muted)}
button.primary{display:inline-flex;align-items:center;gap:10px;background:rgba(39,163,62,.12);border:1px solid rgba(39,163,62,.35);color:var(--green);font-weight:600;font-size:16px;padding:9px 18px;border-radius:12px}
button.primary svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"] button.primary{background:#262a2b;border-color:#343b3c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{background:#262a2b;border-color:#343b3c}}
button.primary:hover{filter:brightness(1.15)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 22px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.chip[aria-pressed=true]{color:var(--green);border-color:var(--green);background:rgba(39,163,62,.12);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:140px}
.col h2{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin:2px 4px 12px}
.col h2 span{color:var(--muted);font-weight:500}
.col h2 button{font-size:12px;padding:3px 8px;color:var(--muted)}
.col>ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.col>ul>li{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg)}
li .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
li p{margin:0;overflow-wrap:anywhere}
.done .txt{color:var(--muted);text-decoration:line-through}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:2px;flex:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:1px solid transparent;color:var(--muted)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{color:var(--green);border-color:var(--line);background:var(--surface)}
.empty{color:var(--muted);font-size:13.5px;padding:6px 4px}
footer{margin-top:28px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .15s,color .15s}}
</style>
</head>
<body data-view="tasks">
<main>
  <header>
    <div>
      <h1>Orbitly - Bring your tasks and notes into orbit</h1>
      <div class="tabs" role="tablist">
        <button type="button" class="tab" id="tabTasks" role="tab" aria-selected="true">Tasks</button>
        <button type="button" class="tab" id="tabNotes" role="tab" aria-selected="false">Notes</button>
      </div>
      <div class="daynav task-only">
        <button type="button" id="prev" aria-label="Previous day">‹</button>
        <input type="date" id="day" aria-label="Date">
        <button type="button" id="next" aria-label="Next day">›</button>
        <button type="button" id="today">Today</button>
      </div>
      <div class="date task-only" id="date"></div>
    </div>
    <div class="stats task-only" id="stats"></div>
  </header>

  <form id="add" class="task-only" autocomplete="off">
    <div class="compose">
      <textarea id="text" rows="3" placeholder="What needs doing today? Start a line with - or 1. for a list" aria-label="Task" required maxlength="2000"></textarea>
      <div class="tools">
        <button type="button" class="ib" id="bul" title="Bulleted list" aria-label="Bulleted list"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
        <button type="button" class="ib" id="num" title="Numbered list" aria-label="Numbered list"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 5l1.5-1v5M3.5 14.5h3l-3 3.5h3"/></svg></button>
        <span class="hint">Ctrl+Enter to add</span>
      </div>
    </div>
    <select id="flag" aria-label="Flag"></select>
    <select id="status" aria-label="Status">
      <option value="todo">To do</option>
      <option value="pending">Pending</option>
      <option value="done">Completed</option>
    </select>
    <button class="primary" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Add task</span></button>
  </form>

  <div class="filters task-only" id="filters" role="group" aria-label="Filter by flag"></div>

  <section class="board task-only" id="board"></section>

  <section class="notes-only" id="notesView">
    <form id="noteForm" autocomplete="off">
      <div class="compose">
        <input type="text" id="noteTitle" placeholder="Note title" aria-label="Note title" required maxlength="120">
        <textarea id="noteBody" rows="4" placeholder="Write your note. Start a line with - or 1. for a list" aria-label="Note" maxlength="10000"></textarea>
        <div class="tools">
          <button type="button" class="ib" id="nbul" title="Bulleted list" aria-label="Bulleted list"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
          <button type="button" class="ib" id="nnum" title="Numbered list" aria-label="Numbered list"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 5l1.5-1v5M3.5 14.5h3l-3 3.5h3"/></svg></button>
          <span class="hint">Ctrl+Enter to save</span>
        </div>
      </div>
      <button class="primary" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg><span>Add note</span></button>
    </form>
    <input type="text" id="search" class="search" placeholder="Search notes" aria-label="Search notes">
    <div class="notes" id="notes"></div>
  </section>
  <footer id="foot">Saved in this browser only.</footer>
</main>

<script>
(function(){
  var FLAGS=[
    {id:'backend',label:'Backend',c:'var(--f-backend)'},
    {id:'frontend',label:'Frontend',c:'var(--f-frontend)'},
    {id:'swag',label:'Swag store',c:'var(--f-swag)'},
    {id:'certificate',label:'Certificate',c:'var(--f-cert)'},
    {id:'h2s',label:'hello.h2s',c:'var(--f-h2s)'}
  ];
  var COLS=[
    {id:'todo',label:'To do'},
    {id:'pending',label:'Pending'},
    {id:'done',label:'Completed'}
  ];
  var tasks=[], filter='all', db=null, mem=false;
  function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
  function shift(s,n){var p=s.split('-');return ymd(new Date(+p[0],+p[1]-1,+p[2]+n))}
  var day=ymd(new Date());
  var $=function(id){return document.getElementById(id)};
  var flagById=function(id){return FLAGS.filter(function(f){return f.id===id})[0]||FLAGS[0]};

  /* ---------- storage (IndexedDB, in-memory fallback) ---------- */
  function openDB(){
    return new Promise(function(res,rej){
      try{
        var r=indexedDB.open('daily-tasks',2);
        r.onupgradeneeded=function(){var d=r.result;['tasks','notes'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
        r.onsuccess=function(){res(r.result)};
        r.onerror=function(){rej(r.error)};
      }catch(e){rej(e)}
    });
  }
  function tx(mode,fn){
    return new Promise(function(res,rej){
      if(mem||!db){res();return}
      try{
        var t=db.transaction('tasks',mode), s=t.objectStore('tasks');
        var out=fn(s);
        t.oncomplete=function(){res(out&&out.result)};
        t.onerror=t.onabort=function(){rej(t.error)};
      }catch(e){rej(e)}
    });
  }
  var save=function(t){return tx('readwrite',function(s){s.put(t)}).catch(warn)};
  var remove=function(id){return tx('readwrite',function(s){s.delete(id)}).catch(warn)};
  function warn(){
    mem=true;
    $('foot').textContent='Storage is unavailable here, so tasks will not survive a refresh.';
  }
  function loadAll(){
    return new Promise(function(res){
      if(!db){res([]);return}
      try{
        var r=db.transaction('tasks').objectStore('tasks').getAll();
        r.onsuccess=function(){res(r.result||[])};
        r.onerror=function(){res([])};
      }catch(e){res([])}
    });
  }

  /* ---------- rendering ---------- */
  function dotEl(c){var d=document.createElement('span');d.className='dot';d.style.setProperty('--c',c);return d}

  var IC={
    todo:'<circle cx="12" cy="12" r="8"/>',
    pending:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
    done:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    today:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
    del:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
    close:'<path d="M6 6l12 12M18 6L6 18"/>'
  };
  function iconBtn(name,title,fn){
    var b=document.createElement('button');
    b.type='button';b.className='ib';b.title=title;b.setAttribute('aria-label',title);
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[name]+'</svg>';
    b.onclick=fn;return b;
  }
  function renderText(el,txt){
    var cur=null,curType=null;
    txt.split('\n').forEach(function(l){
      var m=l.match(/^\s*(?:([-*•])|(\d+)[.)])\s+(.*)$/);
      if(m){
        var type=m[1]?'ul':'ol';
        if(curType!==type){cur=document.createElement(type);el.appendChild(cur);curType=type}
        var li=document.createElement('li');li.textContent=m[3];cur.appendChild(li);
      }else{
        cur=null;curType=null;
        if(l.trim()){var p=document.createElement('p');p.textContent=l;el.appendChild(p)}
      }
    });
  }
  function listKeys(ta,submit){
    ta.addEventListener('keydown',function(e){
      if(e.key!=='Enter'||e.shiftKey)return;
      if(e.ctrlKey||e.metaKey){if(submit){e.preventDefault();submit()}return}
      var v=ta.value,s=ta.selectionStart,ls=v.lastIndexOf('\n',s-1)+1;
      var m=v.slice(ls,s).match(/^(\s*)(?:([-*•])|(\d+)[.)])\s(.*)$/);
      if(!m)return;
      e.preventDefault();
      if(!m[4].trim()){ta.value=v.slice(0,ls)+v.slice(s);ta.selectionStart=ta.selectionEnd=ls;return}
      var pre=m[1]+(m[2]?m[2]+' ':(+m[3]+1)+'. ');
      ta.value=v.slice(0,s)+'\n'+pre+v.slice(ta.selectionEnd);
      ta.selectionStart=ta.selectionEnd=s+1+pre.length;
    });
  }
  function toggleList(ta,kind){
    var v=ta.value,s=ta.selectionStart,ls=v.lastIndexOf('\n',s-1)+1,end=v.indexOf('\n',ls);
    if(end<0)end=v.length;
    var line=v.slice(ls,end),m=line.match(/^\s*(?:[-*•]|\d+[.)])\s/);
    if(m){ta.value=v.slice(0,ls)+line.slice(m[0].length)+v.slice(end);ta.selectionStart=ta.selectionEnd=Math.max(ls,s-m[0].length)}
    else{var pre=kind==='ul'?'- ':'1. ';ta.value=v.slice(0,ls)+pre+v.slice(ls);ta.selectionStart=ta.selectionEnd=s+pre.length}
    ta.focus();
  }
  var notes=[],view='tasks',q='';
  function ntx(mode,fn){
    return new Promise(function(res,rej){
      if(mem||!db){res();return}
      try{var t=db.transaction('notes',mode);fn(t.objectStore('notes'));t.oncomplete=function(){res()};t.onerror=t.onabort=function(){rej(t.error)}}catch(e){rej(e)}
    });
  }
  var nsave=function(n){return ntx('readwrite',function(s){s.put(n)}).catch(warn)};
  var nremove=function(id){return ntx('readwrite',function(s){s.delete(id)}).catch(warn)};
  function loadNotes(){
    return new Promise(function(res){
      if(!db){res([]);return}
      try{var r=db.transaction('notes').objectStore('notes').getAll();r.onsuccess=function(){res(r.result||[])};r.onerror=function(){res([])}}catch(e){res([])}
    });
  }
  function setView(v){
    view=v;document.body.dataset.view=v;
    $('tabTasks').setAttribute('aria-selected',String(v==='tasks'));
    $('tabNotes').setAttribute('aria-selected',String(v==='notes'));
    if(v==='notes')renderNotes();else render();
  }
  function renderNotes(){
    var box=$('notes');box.textContent='';
    var term=q.trim().toLowerCase();
    var list=notes.filter(function(n){return !term||(n.title+' '+n.body).toLowerCase().indexOf(term)>=0}).sort(function(a,b){return b.updated-a.updated});
    if(!list.length){
      var e=document.createElement('div');e.className='empty';
      e.textContent=notes.length?'No notes match your search.':'No notes yet. Add a title and write your first note.';
      box.appendChild(e);return;
    }
    list.forEach(function(n){box.appendChild(noteCard(n))});
  }
  function noteCard(n){
    var el=document.createElement('article');el.className='note';
    var head=document.createElement('div');head.className='nh';
    var h=document.createElement('h3');h.textContent=n.title;
    var act=document.createElement('div');act.className='actions';
    act.appendChild(iconBtn('edit','Edit note',function(){editNote(el,n)}));
    act.appendChild(iconBtn('del','Delete note',function(){nremove(n.id);notes=notes.filter(function(x){return x.id!==n.id});renderNotes()}));
    head.appendChild(h);head.appendChild(act);el.appendChild(head);
    var w=document.createElement('div');w.className='when';
    w.textContent=new Date(n.updated).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
    el.appendChild(w);
    var b=document.createElement('div');b.className='txt';renderText(b,n.body||'');el.appendChild(b);
    return el;
  }
  function editNote(el,n){
    el.textContent='';
    var ti=document.createElement('input');ti.type='text';ti.value=n.title;ti.maxLength=120;ti.style.cssText='width:100%;margin-bottom:8px';
    var ta=document.createElement('textarea');ta.value=n.body||'';ta.rows=Math.min(12,(n.body||'').split('\n').length+2);ta.maxLength=10000;
    var commit=function(){var t=ti.value.trim();if(t){n.title=t;n.body=ta.value.trim();n.updated=Date.now();nsave(n)}renderNotes()};
    listKeys(ta,commit);
    var row=document.createElement('div');row.className='actions';row.style.cssText='justify-content:flex-end;margin-top:8px';
    row.appendChild(iconBtn('close','Cancel',function(){renderNotes()}));
    row.appendChild(iconBtn('done','Save changes',commit));
    el.appendChild(ti);el.appendChild(ta);el.appendChild(row);ti.focus();
  }
  function editCard(li,t){
    li.textContent='';
    var ta=document.createElement('textarea');
    ta.value=t.text;ta.rows=Math.min(8,t.text.split('\n').length+1);ta.maxLength=2000;
    var commit=function(){var v=ta.value.trim();if(v){t.text=v;t.updated=Date.now();save(t)}render()};
    listKeys(ta,commit);
    var row=document.createElement('div');row.className='actions';row.style.cssText='justify-content:flex-end;margin-top:8px';
    row.appendChild(iconBtn('close','Cancel',function(){render()}));
    row.appendChild(iconBtn('done','Save changes',commit));
    li.appendChild(ta);li.appendChild(row);ta.focus();
  }

  function buildStatic(){
    var sel=$('flag');
    FLAGS.forEach(function(f){var o=document.createElement('option');o.value=f.id;o.textContent=f.label;sel.appendChild(o)});
    var box=$('filters');
    [{id:'all',label:'All',c:'var(--muted)'}].concat(FLAGS).forEach(function(f){
      var b=document.createElement('button');
      b.type='button';b.className='chip';b.dataset.flag=f.id;
      b.appendChild(dotEl(f.c));
      b.appendChild(document.createTextNode(f.label));
      b.onclick=function(){filter=f.id;render()};
      box.appendChild(b);
    });
    $('prev').onclick=function(){day=shift(day,-1);render()};
    $('next').onclick=function(){day=shift(day,1);render()};
    $('today').onclick=function(){day=ymd(new Date());render()};
    $('day').onchange=function(){if(this.value){day=this.value;render()}};
  }

  function render(){
    Array.prototype.forEach.call($('filters').children,function(b){
      b.setAttribute('aria-pressed',String(b.dataset.flag===filter));
    });
    $('day').value=day;
    var dp=day.split('-');
    $('date').textContent=new Date(+dp[0],+dp[1]-1,+dp[2]).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(day===ymd(new Date())?' (today)':'');
    var dayTasks=tasks.filter(function(t){return t.date===day});
    var shown=dayTasks.filter(function(t){return filter==='all'||t.flag===filter});
    var board=$('board');board.textContent='';
    COLS.forEach(function(col){
      var items=shown.filter(function(t){return t.status===col.id}).sort(function(a,b){return b.updated-a.updated});
      var sec=document.createElement('div');sec.className='col';
      var h=document.createElement('h2');
      var title=document.createElement('span');title.textContent=col.label+' · '+items.length;
      title.style.color='var(--ink)';
      h.appendChild(title);
      if(col.id==='done'&&items.length){
        var cl=document.createElement('button');cl.type='button';cl.textContent='Clear';cl.title='Clear completed tasks';
        cl.onclick=function(){
          items.forEach(function(t){remove(t.id)});
          var ids=items.map(function(t){return t.id});
          tasks=tasks.filter(function(t){return ids.indexOf(t.id)<0});render();
        };
        h.appendChild(cl);
      }
      sec.appendChild(h);
      if(!items.length){
        var e=document.createElement('div');e.className='empty';
        e.textContent=col.id==='todo'?'Nothing queued.':col.id==='pending'?'Nothing waiting on others.':'Nothing finished yet.';
        sec.appendChild(e);
      }else{
        var ul=document.createElement('ul');
        items.forEach(function(t){ul.appendChild(card(t))});
        sec.appendChild(ul);
      }
      board.appendChild(sec);
    });
    var n=function(s){return dayTasks.filter(function(t){return t.status===s}).length};
    $('stats').innerHTML='<b>'+n('done')+'</b> of <b>'+dayTasks.length+'</b> completed';
  }

  function card(t){
    var li=document.createElement('li');
    if(t.status==='done')li.className='done';
    var top=document.createElement('div');top.className='top';
    var txt=document.createElement('div');txt.className='txt';renderText(txt,t.text);
    var act=document.createElement('div');act.className='actions';
    COLS.forEach(function(c){
      if(c.id===t.status)return;
      var tip=c.id==='done'?'Mark completed':c.id==='todo'?'Move to To do':'Mark pending';
      act.appendChild(iconBtn(c.id,tip,function(){t.status=c.id;t.updated=Date.now();save(t);render()}));
    });
    if(t.date!==ymd(new Date())){
      act.appendChild(iconBtn('today','Move to today',function(){t.date=ymd(new Date());t.updated=Date.now();save(t);render()}));
    }
    act.appendChild(iconBtn('edit','Edit task',function(){editCard(li,t)}));
    act.appendChild(iconBtn('del','Delete task',function(){remove(t.id);tasks=tasks.filter(function(x){return x.id!==t.id});render()}));
    top.appendChild(txt);top.appendChild(act);
    li.appendChild(top);
    var f=flagById(t.flag);
    var fl=document.createElement('span');fl.className='flag';
    fl.appendChild(dotEl(f.c));fl.appendChild(document.createTextNode(f.label));
    var meta=document.createElement('div');meta.className='meta';meta.appendChild(fl);
    li.appendChild(meta);
    return li;
  }

  /* ---------- events ---------- */
  $('add').addEventListener('submit',function(e){
    e.preventDefault();
    var v=$('text').value.trim();
    if(!v)return;
    var now=Date.now();
    var t={id:now.toString(36)+Math.random().toString(36).slice(2,6),text:v,flag:$('flag').value,status:$('status').value,created:now,updated:now,date:day};
    tasks.push(t);save(t);
    $('text').value='';$('text').focus();
    render();
  });

  /* ---------- init ---------- */
  buildStatic();
  listKeys($('text'),function(){$('add').requestSubmit()});
  $('bul').onclick=function(){toggleList($('text'),'ul')};
  $('num').onclick=function(){toggleList($('text'),'ol')};
  $('tabTasks').onclick=function(){setView('tasks')};
  $('tabNotes').onclick=function(){setView('notes')};
  $('nbul').onclick=function(){toggleList($('noteBody'),'ul')};
  $('nnum').onclick=function(){toggleList($('noteBody'),'ol')};
  listKeys($('noteBody'),function(){$('noteForm').requestSubmit()});
  $('search').oninput=function(){q=this.value;renderNotes()};
  $('noteForm').addEventListener('submit',function(e){
    e.preventDefault();
    var t=$('noteTitle').value.trim();if(!t)return;
    var now=Date.now();
    var n={id:now.toString(36)+Math.random().toString(36).slice(2,6),title:t,body:$('noteBody').value.trim(),created:now,updated:now};
    notes.push(n);nsave(n);
    $('noteTitle').value='';$('noteBody').value='';$('noteTitle').focus();
    renderNotes();
  });
  render();
  openDB().then(function(d){db=d;return loadAll()}).then(function(all){tasks=all.map(function(t){if(!t.date){t.date=ymd(new Date(t.created||Date.now()));save(t)}return t});render();return loadNotes()}).then(function(nn){notes=nn;if(view==='notes')renderNotes()}).catch(function(){warn();render()});
})();
</script>
</body>
</html>
